[project]
name = "care-record"
version = "0.1.0"
description = "Voice-to-care-record assistant: caregiver voice notes -> validated, structured care records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "litellm>=1.40",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0", "av<19"]  # av 19 removed an argument faster-whisper 1.2 still passes
ui = ["streamlit>=1.40"]  # st.audio_input
dev = ["pytest>=8"]

[project.scripts]
care = "care_record.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["care_record*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
